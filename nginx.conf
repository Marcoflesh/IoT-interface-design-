server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # En desarrollo: sin caché, así cada cambio se ve al recargar.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    charset utf-8;
}
